<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Hussain Sports</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f9f9f9; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .product-detail { display: flex; gap: 40px; align-items: flex-start; }
        .product-detail img { max-width: 400px; width: 100%; border-radius: 8px; object-fit: cover; }
        .product-info h1 { margin-top: 0; }
        .price { font-size: 24px; color: #e44d26; font-weight: bold; margin: 15px 0; }
        .btn { background: #e44d26; color: #fff; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #d33c15; }
        
        /* Related Products Section */
        .related-section { margin-top: 50px; }
        .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .related-card { border: 1px solid #ddd; padding: 15px; border-radius: 6px; text-align: center; background: #fff; cursor: pointer; transition: transform 0.2s; }
        .related-card:hover { transform: translateY(-5px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .related-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" style="text-decoration: none; color: #007bff; font-weight: bold;">← Back to Home</a>
        
        <div id="productDetailsContainer" style="margin-top: 20px;">
            <p>Loading product details...</p>
        </div>

        <div class="related-section">
            <h3>Related Products</h3>
            <div id="relatedProductsContainer" class="related-grid">
                <!-- Related products will load here -->
            </div>
        </div>
    </div>

    <script>
        // URL se product ID nikalna (e.g., product-detail.html?id=2)
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        async function fetchProductDetails() {
            try {
                const response = await fetch('/api/products');
                const products = await response.json();

                // ID match karna (number ya string dono handle karne ke liye)
                const product = products.find(p => p.id == productId || p._id == productId);

                if (!product) {
                    document.getElementById('productDetailsContainer').innerHTML = '<h2>Product not found!</h2>';
                    return;
                }

                // Main Product Details Render Karein
                document.getElementById('productDetailsContainer').innerHTML = `
                    <div class="product-detail">
                        <img src="${product.image}" alt="${product.name}">
                        <div class="product-info">
                            <h1>${product.name}</h1>
                            <p><strong>Category:</strong> ${product.category} / ${product.subCategory || 'General'}</p>
                            <div class="price">Rs. ${product.price}</div>
                            <p>${product.inStock ? '<span style="color:green; font-weight:bold;">In Stock</span>' : '<span style="color:red; font-weight:bold;">Out of Stock</span>'}</p>
                            <button class="btn" onclick="alert('Product added to cart!')">Add to Cart</button>
                        </div>
                    </div>
                `;

                // Related Products Filter Karein (Wahi category wale, lekin khud yeh product nahi)
                const related = products.filter(p => p.category === product.category && (p.id != productId && p._id != productId));
                
                const relatedContainer = document.getElementById('relatedProductsContainer');
                if (related.length === 0) {
                    relatedContainer.innerHTML = '<p>No related products found.</p>';
                } else {
                    relatedContainer.innerHTML = related.map(rp => `
                        <div class="related-card" onclick="window.location.href='product-detail.html?id=${rp.id || rp._id}'">
                            <img src="${rp.image}" alt="${rp.name}">
                            <h4>${rp.name}</h4>
                            <p style="color: #e44d26; font-weight: bold;">Rs. ${rp.price}</p>
                        </div>
                    `).join('');
                }

            } catch (err) {
                console.error('Error loading product details:', err);
                document.getElementById('productDetailsContainer').innerHTML = '<p>Failed to load product details.</p>';
            }
        }

        fetchProductDetails();
    </script>
</body>
</html>
